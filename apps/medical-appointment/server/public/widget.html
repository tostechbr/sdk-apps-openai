<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medical Appointment</title>
    <style>
        :root {
            --bg-page: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #2563eb;
            --primary-light: #eff6ff;
            --primary-hover: #1d4ed8;
            --success-bg: #f0fdf4;
            --success-text: #15803d;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --radius-lg: 16px;
            --radius-md: 12px;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg-page);
            color: var(--text-main);
            line-height: 1.6;
            padding: 24px 16px;
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 440px;
            margin: 0 auto;
        }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
            border-color: var(--primary);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 20px;
            flex-shrink: 0;
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
        }

        .doctor-info {
            flex: 1;
        }

        .doctor-name {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-main);
            margin-bottom: 2px;
        }

        .doctor-specialty {
            color: var(--primary);
            font-weight: 500;
            font-size: 0.9rem;
            background: var(--primary-light);
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            margin-bottom: 4px;
        }

        .doctor-location {
            color: var(--text-muted);
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .slots-header {
            margin: 24px 0 12px;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .slots-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 10px;
        }

        .slot-btn {
            background: white;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 12px 4px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            box-shadow: var(--shadow-sm);
        }

        .slot-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            transform: translateY(-1px);
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.3);
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 16px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background: #f1f5f9;
            color: var(--text-main);
        }

        .success-card {
            background: var(--success-bg);
            border-color: #bbf7d0;
            text-align: center;
            padding: 40px 24px;
            cursor: default;
        }

        .success-icon {
            width: 64px;
            height: 64px;
            background: var(--success-text);
            border-radius: 50%;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            box-shadow: 0 4px 6px -1px rgba(21, 128, 61, 0.3);
        }

        .success-title {
            font-weight: 800;
            font-size: 1.5rem;
            color: var(--success-text);
            margin-bottom: 12px;
        }

        .empty {
            text-align: center;
            color: var(--text-muted);
            padding: 48px 24px;
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 1px dashed var(--border);
        }

        .section-title {
            font-weight: 700;
            font-size: 1.25rem;
            margin-bottom: 16px;
            color: var(--text-main);
        }
    </style>
</head>

<body>
    <div class="container" id="root"></div>

    <script type="module">
        const root = document.getElementById("root");

        function getInitials(name) {
            return name?.split(" ").map(n => n[0]).join("").slice(0, 2).toUpperCase() || "?";
        }

        function formatTime(timeStr) {
            try {
                const date = new Date(timeStr);
                return date.toLocaleString("pt-BR", {
                    weekday: "short",
                    day: "numeric",
                    month: "short",
                    hour: "2-digit",
                    minute: "2-digit"
                });
            } catch { return timeStr; }
        }

        function renderDoctors(doctors) {
            if (!doctors?.length) {
                return '<div class="empty">Nenhum médico encontrado.</div>';
            }
            return doctors.map(d => `
        <div class="card" data-doctor-id="${d.id}">
          <div class="card-header">
            <div class="avatar">${getInitials(d.name)}</div>
            <div class="doctor-info">
              <div class="doctor-name">${d.name}</div>
              <div class="doctor-specialty">${d.specialty}</div>
              <div class="doctor-location">📍 ${d.city || ""}${d.state ? ", " + d.state : ""}</div>
            </div>
          </div>
        </div>
      `).join("");
        }

        function renderSlots(doctor, slots) {
            const header = `
        <button class="back-btn" id="back-btn">← Voltar</button>
        <div class="card" style="cursor: default;">
          <div class="card-header">
            <div class="avatar">${getInitials(doctor?.name)}</div>
            <div class="doctor-info">
              <div class="doctor-name">${doctor?.name}</div>
              <div class="doctor-specialty">${doctor?.specialty}</div>
              ${doctor?.address ? `<div class="doctor-location">📍 ${doctor.address}</div>` : ""}
            </div>
          </div>
        </div>
        <div class="slots-header">Horários Disponíveis</div>
      `;

            if (!slots?.length) {
                return header + '<div class="empty">Sem horários disponíveis.</div>';
            }

            const slotsHtml = `
        <div class="slots-grid">
          ${slots.map(s => `
            <button class="slot-btn" data-slot-id="${s.id}" data-slot-time="${s.formattedTime || formatTime(s.time)}">
              ${s.formattedTime || formatTime(s.time)}
            </button>
          `).join("")}
        </div>
      `;

            return header + slotsHtml;
        }

        function renderConfirmation(appointment) {
            return `
        <div class="card success-card">
          <div class="success-icon">✓</div>
          <div class="success-title">Agendado!</div>
          <div style="margin-bottom: 12px; font-size: 1.1rem;">
            <strong>${appointment?.doctor?.name}</strong>
          </div>
          <div style="color: var(--text-muted); font-size: 0.95rem;">
            📅 ${appointment?.formattedDate || formatTime(appointment?.scheduledAt)}<br>
            👤 ${appointment?.patient?.name}
          </div>
        </div>
      `;
        }

        // Render App Function
        function renderApp(output) {
            const outputView = output?.view || "default";
            const outputData = output?.widgetData || {};

            console.log("[Medical Widget] Rendering View:", outputView, "Data:", outputData);

            switch (outputView) {
                case "doctors-list":
                    root.innerHTML = renderDoctors(outputData.doctors);
                    root.querySelectorAll("[data-doctor-id]").forEach(el => {
                        el.addEventListener("click", () => {
                            const id = el.dataset.doctorId;
                            if (window.openai?.callTool) {
                                window.openai.callTool("get_available_slots", { doctorId: id });
                            }
                        });
                    });
                    break;

                case "slots-list":
                    root.innerHTML = renderSlots(outputData.doctor, outputData.slots);
                    document.getElementById("back-btn")?.addEventListener("click", () => {
                        window.openai?.sendFollowUpMessage?.("Mostrar médicos novamente");
                    });
                    root.querySelectorAll("[data-slot-id]").forEach(el => {
                        el.addEventListener("click", () => {
                            const time = el.dataset.slotTime;
                            window.openai?.sendFollowUpMessage?.(`Quero agendar às ${time}. Meu nome é [seu nome] e telefone [seu telefone].`);
                        });
                    });
                    break;

                case "confirmation":
                    root.innerHTML = renderConfirmation(outputData.appointment);
                    break;

                case "disambiguation":
                    root.innerHTML = '<div class="section-title">Encontramos vários médicos</div>' + renderDoctors(outputData.matches);
                    root.querySelectorAll("[data-doctor-id]").forEach(el => {
                        el.addEventListener("click", () => {
                            const id = el.dataset.doctorId;
                            if (window.openai?.callTool) {
                                window.openai.callTool("get_available_slots", { doctorId: id });
                            }
                        });
                    });
                    break;

                default:
                    root.innerHTML = '<div class="empty">Pergunte sobre médicos para começar.</div>';
            }
        }

        // Initial Render
        const initialOutput = window.openai?.toolOutput || {};
        renderApp(initialOutput);

        // Listen for updates from ChatGPT (Reactive Update)
        window.addEventListener("openai:set_globals", (event) => {
            const globals = event.detail?.globals;
            if (globals?.toolOutput) {
                console.log("[Medical Widget] Received new data via event");
                renderApp(globals.toolOutput);
            }
        });
    </script>
</body>

</html>
